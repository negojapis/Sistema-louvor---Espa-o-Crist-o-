<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Subtle warm surface background -->
  <rect width="160" height="160" rx="36" fill="#FFF4E8" />
  
  <!-- Geometric Espaço Cristão Cross & Portal Symbol in Brand Orange #D96B0B -->
  <circle cx="80" cy="80" r="54" stroke="#D96B0B" stroke-width="8" stroke-dasharray="16 8" opacity="0.4" />
  
  <!-- Central cross in brand orange -->
